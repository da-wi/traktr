template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax

# Optional but nice to have
url: https://github.com/da-wi/traktr
development:
  mode: auto

navbar:
  structure:
    left: [home, get-started, reference, articles]
    right: [github]
  components:
    get-started:
      text: Getting started
      href: articles/traktr.html
    github:
      icon: fab fa-github
      href: https://github.com/da-wi/traktr

reference:
  - title: "Import input data"
    desc: >
      Read GPS records and county FIPS codes from CSV files.
    contents:
      - read_gps_csv
      - read_fips_csv

  - title: "Define areas of interest"
    desc: >
      Create the spatial units used for exposure and store metadata for later steps.
    contents:
      - mutate_aoi_buffer
      - mutate_aoi_h3
      - aoi_from_sf
      - aoi_us_counties

  - title: "Fetch satellite layers"
    desc: >
      Download remote rasters for your areas of interest. Handles tiling and rate-limits under the hood.
    contents:
      - fetch_ndvi
      - fetch_ndvi_stac
      - fetch_landuse
      - fetch_hfp
      - earthdata_auth_check
      - fetch_aster_ged

  - title: "Attach context layers"
    desc: >
      Compute ready-to-model features. 
    contents:
      - attach_ndvi
      - attach_landuse
      - attach_hfp
      - attach_aster_ged

  - title: "Summarize exposures"
    desc: >
      Aggregate exposures per group
    contents:
      - summarize_exposure

  - title: "Export"
    contents:
      - write_county_summary
