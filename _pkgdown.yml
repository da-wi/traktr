template:
  bootstrap: 5
  light-switch: true

# Optional but nice to have
url: https://github.com/da-wi/traktr
development:
  mode: auto

navbar:
  structure:
    left: [home, get-started, reference, articles]
    right: [github]
  components:
    get-started:
      text: Getting started
      href: articles/traktr.html
    github:
      icon: fab fa-github
      href: https://github.com/da-wi/traktr

reference:
  - title: "Import GPS data"
    desc: >
      Read raw GPS CSV files into a tidy tibble
    contents:
      - read_gps_csv

  - title: "Define areas of interest"
    desc: >
      Create the spatial units used for exposure and store metadata for later steps.
    contents:
      - mutate_aoi_buffer
      - mutate_aoi_h3

  - title: "Fetch satellite layers"
    desc: >
      Download remote rasters for your areas of interest. Handles tiling and rate-limits under the hood.
    contents:
      - fetch_ndvi
      - fetch_landuse

  - title: "Attach & aggregate exposures"
    desc: >
      Compute ready-to-model features. 
    contents:
      - attach_ndvi
      - attach_landuse
